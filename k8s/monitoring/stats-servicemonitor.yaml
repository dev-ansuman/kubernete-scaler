apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: stats-service-monitor
  namespace: monitoring
  labels:
    release: prometheus
spec:
  namespaceSelector:
    matchNames:
      - monitoring-app
  selector:
    matchLabels:
      app: stats-service
  endpoints:
    - port: metrics
      path: /metrics
      interval: 15s