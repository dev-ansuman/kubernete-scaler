apiVersion: apps/v1
kind: Deployment
metadata:
  name: stats-service
  namespace: monitoring-app
  labels:
    app: stats-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: stats-service
  template:
    metadata:
      labels:
        app: stats-service
    spec:
      containers:
        - name: stats-service
          image: stats-service:1.0
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 3002
              protocol: TCP
          env:
            - name: PORT
              value: "3002"
          envFrom:
            - configMapRef:
                name: app-config
          resources:
            requests:
              cpu: "120m"
              memory: "160Mi"
            limits:
              cpu: "300m"
              memory: "320Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 3002
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 3002
            initialDelaySeconds: 5
            periodSeconds: 5
